name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .[dev]
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - if: matrix.python-version == '3.12'
        run: python -m mypy src
      - run: python -m pytest -q

  results-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-results.txt && python -m pip install --no-deps -e .
      - name: Regenerate the demo results and README table
        run: |
          python -m abkit.cli demo --out results
          python -m abkit.cli inject-readme README.md --results results
      - name: Fail if any committed number differs from what the code produces
        run: git diff --exit-code -- results/report.md results/table.md README.md
